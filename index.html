<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brooklyn After Dark</title>
    <meta name="theme-color" content="#000000" />
    <link rel="icon" href="K.svg" />

    <style>
        :root{
            --pad: 64px;
            --nav-h: 92px;
            --bg: #000;
            --fg: rgba(255,255,255,.95);
            --stroke: rgba(255,255,255,.92);
            --blue: #00B2FF;
            --orange: #FF6000;
            --brown: #9A7200;
        }

        @font-face {
            font-family: "RapidRegExtended";
            src: url("fonts/rapid/RapidRegExtended.otf") format("opentype"),
                 url("fonts/rapid/RapidRegExtended.ttf") format("truetype");
            font-weight: 400;
            font-style: normal;
            font-display: swap;
        }

        @font-face {
            font-family: "RapidRegWide";
            src: url("fonts/rapid/RapidRegWide.otf") format("opentype"),
                 url("fonts/rapid/RapidRegWide.ttf") format("truetype");
            font-weight: 400;
            font-style: normal;
            font-display: swap;
        }

        @font-face {
            font-family: "RapidRegular";
            src: url("fonts/rapid/RapidRegular.otf") format("opentype"),
                 url("fonts/rapid/RapidRegular.ttf") format("truetype");
            font-weight: 400;
            font-style: normal;
            font-display: swap;
        }

        *{ box-sizing: border-box; }
        html, body{ height: 100%; }
        body{
            margin: 0;
            background: var(--bg);
            color: var(--fg);
            font-family: "RapidRegExtended", system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow-x: hidden;
            padding-top: var(--nav-h);
        }

        .container{
            padding-left: var(--pad);
            padding-right: var(--pad);
        }

        .nav{
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 10;
            background: linear-gradient(to bottom, rgba(0,0,0,.92), rgba(0,0,0,.70) 65%, rgba(0,0,0,0));
            padding-top: 24px;
            padding-bottom: 22px;
            font-family: "RapidRegular", "RapidRegExtended", inherit;
        }

        .nav__row{
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 24px;
        }

        .home{
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 46px;
            height: 46px;
            border: 0;
            background: transparent;
            padding: 0;
            cursor: pointer;
        }

        .home img{
            width: 44px;
            height: auto;
            display: block;
        }

        .nav__links{
            display: inline-flex;
            gap: 0;
            border: 1px solid var(--stroke);
            border-radius: 12px;
            overflow: hidden;
        }

        .nav__links a{
            display: inline-flex;
            align-items: center;
            justify-content: center;
            height: 44px;
            padding: 0 26px;
            color: var(--fg);
            text-decoration: none;
            text-transform: uppercase;
            font-size: 18px;
            line-height: 1;
            font-family: "RapidRegExtended", inherit;
        }

        .nav__links a + a{
            border-left: 1px solid var(--stroke);
        }

        .nav__links a:focus-visible{
            outline: 2px solid rgba(255,255,255,.55);
            outline-offset: 4px;
        }

        .hero{
            min-height: calc(100vh - var(--nav-h));
            display: grid;
            align-content: start;
            padding-top: clamp(52px, 7vh, 96px);
            padding-bottom: 96px;
        }

        .hero--intro{
            min-height: calc(100vh - var(--nav-h));
            display: grid;
            place-items: center;
            padding-top: 0;
            padding-bottom: 0;
        }

        .intro__title{
            margin: 0;
            text-transform: uppercase;
            font-size: 96px;
            line-height: 1;
            font-family: "RapidRegular", "RapidRegExtended", inherit;
            text-align: center;
        }

        .intro__title br,
        .hero__title br{
            display: block;
        }

        .hero--detail{
            min-height: calc(100vh - var(--nav-h));
        }

        .hero__date{
            font-family: "RapidRegular", "RapidRegWide", "RapidRegExtended", inherit;
            font-size: 36px;
            margin: 0 0 20px 0;
            text-transform: none;
        }

        .hero__title{
            margin: 0;
            text-transform: uppercase;
            font-size: 108px;
            line-height: 1;
            max-width: 1400px;
            font-family: "RapidRegular", "RapidRegExtended", inherit;
        }

        .hero__tagline{
            margin-top: clamp(120px, 18vh, 240px);
            font-family: "RapidRegWide", "RapidRegExtended", inherit;
            font-size: 36px;
            letter-spacing: .01em;
        }

        .tag__num{ font-variant-numeric: tabular-nums; }
        .tag__num--blue{ color: var(--blue); }
        .tag__num--orange{ color: var(--orange); }
        .tag__num--brown{ color: var(--brown); }

        /* Placeholder for future sections */
        .section{
            padding-top: 96px;
            padding-bottom: 96px;
        }

        .section--spacer{
            min-height: 70vh;
        }

        @media (max-width: 720px){
            :root{ --pad: 24px; }
            .nav__links a{
                padding: 0 16px;
                font-size: 18px;
                height: 40px;
            }
        }
    </style>
</head>
<body>
    <header class="nav">
        <div class="container">
            <div class="nav__row">
                <a class="home" href="index.html" aria-label="Home">
                    <img src="K.svg" alt="" aria-hidden="true" />
                </a>

                <nav class="nav__links" aria-label="Primary">
                    <a href="#about">ABOUT US</a>
                    <a href="lineup/lineup.html">LINEUP</a>
                    <a href="#tickets">TICKETS</a>
                </nav>
            </div>
        </div>
    </header>

    <main>
        <!-- Screen 1 -->
        <section class="hero hero--intro container" aria-label="Intro">
            <h1 class="intro__title">BK<br/>AD</h1>
        </section>

        <!-- Screen 2 -->
        <section class="hero hero--detail container" aria-label="Hero">
            <p class="hero__date">August 14-17</p>
            <h2 class="hero__title">BROOKLYN<br/>AFTER DARK</h2>
            <div class="hero__tagline" aria-label="Tagline">
                <span class="tag__num tag__num--blue">4</span> nights.
                <span class="tag__num tag__num--orange">4</span> DJs.
                <span class="tag__num tag__num--brown">1</span> bridge.
            </div>
        </section>

        <!-- Structured placeholders for upcoming content -->
        <section class="section section--spacer container" id="about" aria-label="About Us"></section>
        <section class="section section--spacer container" id="tickets" aria-label="Tickets"></section>
    </main>

    <script></script>
</body>
</html>
