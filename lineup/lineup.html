<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#000000" />
    <title>Lineup — Brooklyn After Dark</title>
    <link rel="icon" href="../K.svg" />
    <style>
      :root {
        --pad-left: 64px;
        --pad-edge: 32px;
        --white: rgba(255, 255, 255, 0.95);
        --neongreen: #5CFF00;
        --neonblue: #00B2FF;
        --neonorange: #FF6000;
        --neonbrown: #9A7200;
        --accent: var(--neongreen);
        --fade: 300ms;
      }

      /* Rapid typeface (paths relative to `lineup/lineup.html`). */
      @font-face {
        font-family: "Rapid";
        src: url("../fonts/rapid/RapidRegular.otf") format("opentype"),
          url("../fonts/rapid/RapidRegular.ttf") format("truetype");
        font-weight: 400;
        font-style: normal;
        font-display: swap;
      }

      @font-face {
        font-family: "RapidRegExtended";
        src: url("../fonts/rapid/RapidRegExtended.otf") format("opentype"),
          url("../fonts/rapid/RapidRegExtended.ttf") format("truetype");
        font-weight: 400;
        font-style: normal;
        font-display: swap;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
      }

      html {
        background: #000;
        overflow: hidden;
      }

      body {
        margin: 0;
        background: #000;
        color: var(--white);
        overflow: hidden;
        overscroll-behavior: none;
        font-family: "RapidRegExtended", "Rapid";
      }

      body.about-open {
        overflow: hidden;
      }

      .nav {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        z-index: 10;
        padding-top: 24px;
        padding-bottom: 22px;
        background: linear-gradient(
          to bottom,
          rgba(0, 0, 0, 0.92),
          rgba(0, 0, 0, 0.7) 65%,
          rgba(0, 0, 0, 0)
        );
      }

      .container {
        padding-left: var(--pad-left);
        padding-right: var(--pad-left);
      }

      .nav__row {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 24px;
      }

      .home {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 46px;
        height: 46px;
        text-decoration: none;
      }

      .home img {
        width: 44px;
        height: auto;
        display: block;
      }

      .nav__links {
        display: inline-flex;
      }

      .nav__links a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        height: 44px;
        padding: 0 26px;
        color: var(--white);
        text-decoration: none;
        text-transform: uppercase;
        font-size: 18px;
        line-height: 1;
        font-family: "RapidRegExtended", inherit;
        border: 1px solid rgba(255, 255, 255, 0.92);
        border-radius: 12px;
      }

      .nav__links a + a {
        margin-left: -1px;
      }

      .nav__links a:focus-visible {
        outline: 2px solid rgba(255, 255, 255, 0.55);
        outline-offset: 4px;
      }

      /* About overlay */
      .about-panel {
        position: fixed;
        inset: 0;
        z-index: 30;
        background: var(--neongreen);
        color: #000;
        transform: translateX(102%);
        transition: transform 300ms ease;
        pointer-events: none;
        will-change: transform;
        overflow: auto;
      }

      .about-panel.is-open {
        transform: translateX(0);
        pointer-events: auto;
      }

      .about-top {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 24px;
        padding-top: 24px;
      }

      .about-home img {
        filter: invert(1);
      }

      .about-close {
        border: 0;
        background: transparent;
        color: #000;
        cursor: pointer;
        padding: 0;
        margin: 0;
        height: 46px;
        display: inline-flex;
        align-items: flex-start;
        justify-content: flex-end;
        font-family: "video", serif;
        font-weight: 400;
        font-style: normal;
        font-size: 64px;
        line-height: 0.8;
        position: relative;
        top: -8px;
      }

      .about-close:focus-visible {
        outline: 2px solid rgba(0, 0, 0, 0.65);
        outline-offset: 6px;
      }

      .about-content {
        padding-top: clamp(220px, 32vh, 420px);
        padding-bottom: 72px;
        font-family: "RapidRegExtended", system-ui, sans-serif;
      }

      .about-title {
        margin: 0 0 46px 0;
        text-transform: uppercase;
        letter-spacing: 0.02em;
        font-size: 36pt;
        line-height: 1;
        font-family: "RapidRegExtended", system-ui, sans-serif;
      }

      .about-text {
        margin: 0;
        max-width: 1400px;
        font-size: 36pt;
        line-height: 1.15;
        letter-spacing: 0.01em;
        font-family: "Rapid", system-ui, sans-serif;
      }

      .stage {
        position: fixed;
        inset: 0;
        padding-left: var(--pad-left);
      }

      .bg {
        position: fixed;
        inset: 0;
        z-index: 0;
        opacity: 0;
        transition: opacity var(--fade) ease;
        background-color: #000;
        background-repeat: no-repeat;
        background-size: cover;
        background-position: center;
        filter: saturate(1.1) contrast(1.05);
      }

      .bg::after {
        content: "";
        position: absolute;
        inset: 0;
        background: rgba(0, 0, 0, 0);
        transition: background var(--fade) ease;
      }

      .bg.is-active {
        opacity: 1;
      }

      .bg.is-active::after {
        /* Darken active images for text legibility. */
        background: rgba(0, 0, 0, 0.48);
      }

      .lineup {
        position: absolute;
        z-index: 2;
        left: var(--pad-left);
        bottom: 52px;
        margin: 0;
        padding: 0;
        list-style: none;
        text-transform: uppercase;
        font-size: 36pt;
        line-height: 1.1;
        font-family: "RapidRegExtended", "Rapid", inherit;
      }

      .dj {
        margin: 0;
        padding: 0;
      }

      .dj-btn {
        appearance: none;
        border: 0;
        background: transparent;
        color: var(--white);
        padding: 0;
        margin: 0;
        font: inherit;
        letter-spacing: inherit;
        text-transform: inherit;
        line-height: inherit;
        cursor: pointer;
        transition: color var(--fade) ease;
      }

      .dj-btn:focus-visible {
        outline: 2px solid color-mix(in srgb, var(--accent) 55%, transparent);
        outline-offset: 10px;
      }

      .dj-btn.is-active {
        color: var(--accent);
      }

      .date {
        position: fixed;
        z-index: 2;
        right: var(--pad-left);
        top: 0;
        transform: translateY(-50%);
        color: var(--accent);
        text-transform: lowercase;
        font-weight: 300;
        font-size: 36pt;
        line-height: 1.1;
        opacity: 0;
        transition: opacity var(--fade) ease;
        pointer-events: none;
        user-select: none;
        white-space: nowrap;
        text-shadow: 0 0 10px rgba(0, 0, 0, 0.6),
          0 0 14px color-mix(in srgb, var(--accent) 25%, transparent);
        font-family: "RapidRegExtended", "Rapid", inherit;
      }

      .date.is-active {
        opacity: 1;
      }

      @media (prefers-reduced-motion: reduce) {
        .bg,
        .dj-btn,
        .date {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <header class="nav">
      <div class="container">
        <div class="nav__row">
          <a class="home" href="../index.html" aria-label="Home">
            <img src="../K.svg" alt="" aria-hidden="true" />
          </a>
          <nav class="nav__links" aria-label="Primary">
            <a href="lineup.html">LINEUP</a>
            <a href="../tickets/tickets.html">TICKETS</a>
            <a href="#about" id="aboutLink">ABOUT US</a>
          </nav>
        </div>
      </div>
    </header>

    <aside class="about-panel" id="aboutPanel" aria-hidden="true">
      <div class="container">
        <div class="about-top">
          <a class="home about-home" href="../index.html" aria-label="Home">
            <img src="../K.svg" alt="" aria-hidden="true" />
          </a>
          <button class="about-close" type="button" id="aboutClose" aria-label="Close">x</button>
        </div>

        <div class="about-content" role="dialog" aria-modal="true" aria-label="About Us">
          <h2 class="about-title">ABOUT US</h2>
          <p class="about-text">
            Brooklyn After Dark (BKAD) is a four-night electronic music experience, taking place on the
            Brooklyn Bridge. From underground club sounds to high-energy live sets, each night is
            curated to feel distinct while staying rooted in the heart of Brooklyn’s night life.
          </p>
        </div>
      </div>
    </aside>
    <main class="stage" id="stage" aria-label="DJ lineup">
      <div class="bg" data-dj="PEGGY GOU" style="background-image: url('../images/djs/peggy.webp')"></div>
      <div
        class="bg"
        data-dj="DISCO LINES"
        style="background-image: url('../images/djs/discolines.webp')"
      ></div>
      <div
        class="bg"
        data-dj="DJ MANDY"
        style="background-image: url('../images/djs/djmandy.jpg')"
      ></div>
      <div
        class="bg"
        data-dj="IDRIS ELBA"
        style="background-image: url('../images/djs/idris%20elba.webp')"
      ></div>

      <ul class="lineup" id="lineup">
        <li class="dj">
          <button class="dj-btn" type="button" data-dj="PEGGY GOU">PEGGY GOU</button>
        </li>
        <li class="dj">
          <button class="dj-btn" type="button" data-dj="DISCO LINES">DISCO LINES</button>
        </li>
        <li class="dj">
          <button class="dj-btn" type="button" data-dj="DJ MANDY">DJ MANDY</button>
        </li>
        <li class="dj">
          <button class="dj-btn" type="button" data-dj="IDRIS ELBA">IDRIS ELBA</button>
        </li>
      </ul>

      <div class="date" id="date" aria-hidden="true"></div>
    </main>
    <script>
      const DJ_DATES = {
        "PEGGY GOU": "August 14, 2026",
        "DISCO LINES": "August 15, 2026",
        "DJ MANDY": "August 16, 2026",
        "IDRIS ELBA": "August 17, 2026",
      };

      const DJ_ACCENTS = {
        "PEGGY GOU": "var(--neongreen)",
        "DISCO LINES": "var(--neonblue)",
        "DJ MANDY": "var(--neonorange)",
        "IDRIS ELBA": "var(--neonbrown)",
      };

      const stage = document.getElementById("stage");
      const lineup = document.getElementById("lineup");
      const dateEl = document.getElementById("date");

      const bgByDj = new Map(
        [...stage.querySelectorAll(".bg[data-dj]")].map((el) => [el.dataset.dj, el]),
      );

      function setActive(djName, sourceEl) {
        const next = djName && DJ_DATES[djName] ? djName : null;

        for (const [name, el] of bgByDj.entries()) {
          el.classList.toggle("is-active", Boolean(next && name === next));
        }

        for (const btn of lineup.querySelectorAll(".dj-btn")) {
          btn.classList.toggle("is-active", Boolean(next && btn.dataset.dj === next));
        }

        if (!next) {
          dateEl.textContent = "";
          dateEl.classList.remove("is-active");
          dateEl.style.top = "0px";
          stage.style.setProperty("--accent", "var(--neongreen)");
          return;
        }

        dateEl.textContent = DJ_DATES[next];
        dateEl.classList.add("is-active");
        stage.style.setProperty("--accent", DJ_ACCENTS[next] || "var(--neongreen)");

        if (sourceEl) {
          const rect = sourceEl.getBoundingClientRect();
          // Align date vertically with the hovered line (centered).
          dateEl.style.top = `${Math.round(rect.top + rect.height / 2)}px`;
        }
      }

      // Preload background images for smoother fades.
      for (const el of bgByDj.values()) {
        const raw = getComputedStyle(el).backgroundImage;
        const match = raw && raw.match(/url\\(\"?(.*?)\"?\\)/);
        if (match && match[1]) {
          const img = new Image();
          img.src = match[1];
        }
      }

      lineup.addEventListener("pointerover", (e) => {
        const btn = e.target.closest(".dj-btn[data-dj]");
        if (!btn) return;
        setActive(btn.dataset.dj, btn);
      });

      lineup.addEventListener("pointerout", (e) => {
        const fromBtn = e.target.closest(".dj-btn[data-dj]");
        if (!fromBtn) return;
        const to = e.relatedTarget;
        if (to && lineup.contains(to)) return;
        setActive(null);
      });

      lineup.addEventListener("focusin", (e) => {
        const btn = e.target.closest(".dj-btn[data-dj]");
        if (!btn) return;
        setActive(btn.dataset.dj, btn);
      });

      lineup.addEventListener("focusout", (e) => {
        const to = e.relatedTarget;
        if (to && lineup.contains(to)) return;
        setActive(null);
      });

      lineup.addEventListener("click", (e) => {
        const btn = e.target.closest(".dj-btn[data-dj]");
        if (!btn) return;
        window.location.href = "../tickets/tickets.html";
      });

      const aboutLink = document.getElementById("aboutLink");
      const aboutPanel = document.getElementById("aboutPanel");
      const aboutClose = document.getElementById("aboutClose");

      let lastFocus = null;

      function openAbout() {
        lastFocus = document.activeElement;
        aboutPanel.classList.add("is-open");
        aboutPanel.setAttribute("aria-hidden", "false");
        document.body.classList.add("about-open");
        aboutClose?.focus();
      }

      function closeAbout() {
        aboutPanel.classList.remove("is-open");
        aboutPanel.setAttribute("aria-hidden", "true");
        document.body.classList.remove("about-open");
        if (lastFocus && typeof lastFocus.focus === "function") lastFocus.focus();
      }

      aboutLink?.addEventListener("click", (e) => {
        e.preventDefault();
        openAbout();
      });

      aboutClose?.addEventListener("click", () => closeAbout());

      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape" && aboutPanel.classList.contains("is-open")) closeAbout();
      });

      // Start with black / no date.
      setActive(null);
    </script>
  </body>
</html>
